{% extends "base.html" %}
{% block title %}Audit log · Operations Portal{% endblock %}
{% block content %}
<div class="page-heading">
  <div><h1>Audit log</h1><p>Events visible within your assigned audit scope.</p></div>
  <div class="page-actions"><a class="button secondary" href="/api/export/audit.csv">Export CSV</a><a class="button secondary" href="/api/export/audit.json">Export JSON</a></div>
</div>
<form class="filters" method="get" action="/audit">
  <label>Module<select name="module"><option value="">All in my scope</option>{% for key in ["counterparties", "claims", "flags", "access_reviews", "audit"] %}<option value="{{ key }}" {% if selected_module == key %}selected{% endif %}>{{ key|replace("_", " ")|title }}</option>{% endfor %}</select></label>
  <label>Resource ID<input name="resource_id" value="{{ resource_id }}"></label><button type="submit">Filter</button>
</form>
{% set audit = events %}{% include "audit_rows.html" %}
{% endblock %}
